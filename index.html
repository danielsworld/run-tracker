/* ═══════════════ UTILS ═══════════════ */
const pad = (n) => String(n).padStart(2, "0");
const iso = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;

const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);

/* ═══════════════ STORAGE ═══════════════ */
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { logs: {}, ov: {}, applied: [] };
    const v = JSON.parse(raw);
    return { logs: v.logs || {}, ov: v.ov || {}, applied: v.applied || [] };
  } catch (e) { return { logs: {}, ov: {}, applied: [] }; }
}
function saveState(n) {
  try { localStorage.setItem(KEY, JSON.stringify(n)); return true; }
  catch (e) { return false; }
}

/* ═══════════════ ADJUSTMENTS ═══════════════ */
function adjust(days, logs, today) {
  const out = [];
  const past = days.filter((x) => x.d < today);
  const future = days.filter((x) => x.d >= today);
  const missed = (x) => logs[x.d] && logs[x.d].status === "missed";
  const done = (x) => logs[x.d] && logs[x.d].status !== "missed";

  const pain = past.filter((x) => logs[x.d] && logs[x.d].pain).sort((a, b) => (a.d < b.d ? 1 : -1))[0];
  if (pain && diff(today, pain.d) <= 4) {
    const n2 = future.filter((x) => x.ty !== "rest").slice(0, 2);
    out.push({ id: "pain", sev: "alert", title: "You flagged pain",
      body: `Logged ${fShort(pain.d)}. Sharp or one-sided pain is a different signal from workout fatigue. Back off, and if it hasn't settled in a few days get it looked at.`,
      apply: n2.length ? { label: `Make ${n2.map((x) => fDow(x.d)).join(" & ")} easy`,
        edits: n2.map((x, i) => ({ d: x.d, patch: i === 0
          ? { ty: "rest", mi: 0, t: "Rest — pain", s: "Full day off", lift: null, core: false, ln: null }
          : { ty: "easy", mi: 2.5, t: "Easy — pain", s: "2–3 mi very easy, stop if symptomatic", lift: null, ln: null } })) } : null });
  }

  past.filter((x) => QUALITY.has(x.ty) && missed(x) && diff(today, x.d) <= 7).forEach((m) => {
    const slot = future.find((x) => {
      if (["rest", "race", "long"].includes(x.ty) || QUALITY.has(x.ty)) return false;
      return days.filter((y) => QUALITY.has(y.ty) && y.d !== m.d).every((y) => Math.abs(diff(x.d, y.d)) >= 2);
    });
    out.push({ id: `mq-${m.d}`, sev: "warn", title: `Missed ${m.t} · ${fShort(m.d)}`,
      body: slot ? `${fShort(slot.d)} works and keeps 48 hours between hard days.`
        : `No slot left that keeps 48 hours between hard days. Let it go — one missed session won't cost you the goal, two crowded ones can.`,
      apply: slot ? { label: `Move to ${fDow(slot.d)}`, edits: [{ d: slot.d, patch: { ty: m.ty, mi: m.mi, t: m.t, s: m.s, moved: `from ${fShort(m.d)}` } }] } : null });
  });

  let gap = 0;
  for (let i = past.length - 1; i >= 0; i--) {
    const x = past[i];
    if (x.ty === "rest") continue;
    if (missed(x) || !logs[x.d]) gap++; else break;
  }
  if (gap >= 3) {
    const nq = future.find((x) => QUALITY.has(x.ty) && x.ty !== "race");
    out.push({ id: "gap", sev: "warn", title: `${gap} run days missed`,
      body: `The instinct is to make it up. Don't. Take 25% off the next hard session and you'll absorb the rest of the block better.`,
      apply: nq ? { label: `Trim ${fDow(nq.d)} by 25%`, edits: [{ d: nq.d, patch: { mi: Math.round(nq.mi * 0.78 * 2) / 2, t: nq.t + " (reduced)", s: nq.s + " — cut 25% of the reps" } }] } : null });
  }

  const lh = past.filter((x) => QUALITY.has(x.ty) && done(x)).sort((a, b) => (a.d < b.d ? 1 : -1))[0];
  if (lh && logs[lh.d].rpe >= 9 && diff(today, lh.d) <= 5) {
    const nq = future.find((x) => QUALITY.has(x.ty) && x.ty !== "race");
    out.push({ id: "rpe", sev: "warn", title: `${lh.t} hit RPE ${logs[lh.d].rpe}`,
      body: `A 7–8 session landing at ${logs[lh.d].rpe} usually means fatigue, not a fitness jump. Ease the next one instead of chasing paces.`,
      apply: nq ? { label: `Ease ${fDow(nq.d)} by 5 sec/mi`, edits: [{ d: nq.d, patch: { t: nq.t + " (eased)", s: nq.s + " — ease 5 sec/mi" } }] } : null });
  }

  const ld = past.filter((x) => x.lift);
  const lDone = ld.filter((x) => logs[x.d] && logs[x.d].lift).length;
  if (ld.length >= 3 && lDone / ld.length < 0.5) {
    out.push({ id: "lift", sev: "info", title: `Strength: ${lDone} of ${ld.length}`,
      body: `Doesn't change the running plan. But the Nordics and calf work are most of what keeps you healthy, and the plyos are the part that makes you faster. A 15-minute version counts.`, apply: null });
  }

  const dOut = diff(RACE, today);
  if (dOut <= 7 && dOut >= 0) {
    out.push({ id: "taper", sev: "info", title: `${dOut} day${dOut === 1 ? "" : "s"} out`,
      body: `Nothing you add now makes you fitter; plenty could make you flatter. No strength work, no new shoes, no new breakfast.`, apply: null });
  }
  return out;
}

    plan: "M4 6h16M4 12h16M4 18h10",
    lift: "M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8",
    mob: "M3 14c2.5-4 4.5-4 7 0s4.5 4 7 0M3 8c2.5-4 4.5-4 7 0s4.5 4 7 0",
    adj: "M4 8h10M18 8h2M4 16h4M12 16h8M15 5v6M9 13v6",
    back: "M15 5l-7 7 7 7",
  }[n];
  const s = n === "back" ? 18 : 21;
  return <svg viewBox="0 0 24 24" width={s} height={s} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={p} /></svg>;
};

/* ═══════════════ APP ═══════════════ */
function App() {
  const init = loadState();
  const [logs, setLogs] = useState(init.logs);
  const [ov, setOv] = useState(init.ov);
  const [applied, setApplied] = useState(init.applied);
  const [toast, setToast] = useState(null);
  const [tab, setTab] = useState("today");
  const [editing, setEditing] = useState(null);
  const fileRef = useRef(null);
  const today = todayISO();

  const flash = (msg, bad) => { setToast({ msg, bad }); setTimeout(() => setToast(null), 2200); };

  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  // Freeze the page behind the log sheet, then put the reader back where they were.
  useEffect(() => {
    if (!editing) return;
    const y = window.scrollY;
    const b = document.body.style;
    b.position = "fixed"; b.top = `-${y}px`; b.left = "0"; b.right = "0";
    return () => {
      b.position = ""; b.top = ""; b.left = ""; b.right = "";
      window.scrollTo(0, y);
    };
  }, [editing]);

  const commit = useCallback((next, msg) => {
    const ok = saveState(next);
    if (msg) flash(ok ? msg : msg + " · couldn't save to this device", !ok);
  }, []);

  const days = useMemo(() => PLAN.map((p) => ({ ...p, ...(ov[p.d] || {}) })), [ov]);
  const cards = useMemo(() => adjust(days, logs, today).filter((c) => !applied.some((a) => a.id === c.id)), [days, logs, today, applied]);

  const saveLog = (d, e) => { const n = { ...logs, [d]: e }; setLogs(n); commit({ logs: n, ov, applied }, "Session logged"); setEditing(null); };
  const delLog = (d) => { const n = { ...logs }; delete n[d]; setLogs(n); commit({ logs: n, ov, applied }, "Entry deleted"); setEditing(null); };
  const applyCard = (c) => {
    const n = { ...ov };
    c.apply.edits.forEach((e) => { n[e.d] = { ...(n[e.d] || {}), ...e.patch }; });
    const a = [...applied, { id: c.id, label: c.apply.label, on: today }];
    setOv(n); setApplied(a); commit({ logs, ov: n, applied: a }, "Plan updated");
  };

  const stats = useMemo(() => {
    const p = days.filter((x) => x.d <= today).reduce((a, x) => a + x.mi, 0);
    const a = Object.values(logs).reduce((s, l) => s + (l.miles || 0), 0);
    const q = days.filter((x) => QUALITY.has(x.ty) && x.d < today);
    return { planned: p, actual: a, qT: q.length, qD: q.filter((x) => logs[x.d] && logs[x.d].status !== "missed").length };
  }, [days, logs, today]);

  const handoff = useMemo(() => summary(days, logs, applied, today, stats), [days, logs, applied, today, stats]);
  const copy = async () => {
    try { await navigator.clipboard.writeText(handoff); flash("Copied to clipboard"); }
    catch (e) { flash("Select the text and copy manually", true); }
  };

  const exportBackup = () => {
    try {
      const blob = new Blob([JSON.stringify({ logs, ov, applied, savedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `sub18-backup-${today}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      flash("Backup downloaded");
    } catch (e) { flash("Couldn't create the backup file", true); }
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const v = JSON.parse(reader.result);
        if (!v || typeof v !== "object" || !("logs" in v)) { flash("That file isn't a valid backup", true); return; }
        const next = { logs: v.logs || {}, ov: v.ov || {}, applied: v.applied || [] };
        setLogs(next.logs); setOv(next.ov); setApplied(next.applied);
        commit(next, "Backup restored");
      } catch (e) { flash("Couldn't read that file", true); }
    };
    reader.onerror = () => flash("Couldn't read that file", true);
    reader.readAsText(file);
  };

  const resetAll = () => {
    const next = { logs: {}, ov: {}, applied: [] };
    setLogs({}); setOv({}); setApplied([]);
    commit(next, "All data cleared");
  };

  const dOut = diff(RACE, today);
  const cur = days.find((x) => x.d === today) || days.find((x) => x.d >= today);

  return (
    <div className="app">
      <header className="hdr">
        <div className="hdr-in">
          <button className="hdr-home" onClick={() => setTab("today")} aria-label="Back to today">
            {tab !== "today" && <span className="hdr-b"><Icon n="back" /></span>}
            <span>
              <span className="hdr-t">Sub-18 · 5K</span>
              <span className="hdr-s">{tab === "today" ? "Sat 3 Oct · goal 5:44–5:47/mi" : "Back to today"}</span>
            </span>
          </button>
          <div className="hdr-cd"><b>{dOut >= 0 ? dOut : "—"}</b><span>days</span></div>
        </div>
      </header>

      <main className="main">
        {tab === "today" && <Today day={cur} today={today} days={days} logs={logs} onEdit={setEditing} cards={cards} go={setTab} />}
        {tab === "plan" && <Plan days={days} logs={logs} today={today} stats={stats} onEdit={setEditing} />}
        {tab === "lift" && <Strength />}
        {tab === "mob" && <Mobility />}
        {tab === "adj" && <Adjust cards={cards} applied={applied} onApply={applyCard} handoff={handoff} copy={copy}
          onExport={exportBackup} onImport={() => fileRef.current && fileRef.current.click()} onReset={resetAll} />}
      </main>

      <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }}
        onChange={(e) => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; }} />

      {toast && <div className={"toast" + (toast.bad ? " bad" : "")}>{toast.msg}</div>}

      <nav className="tabbar">
        <div className="tabbar-in">
          {[["today", "Today"], ["plan", "Plan"], ["lift", "Strength"], ["mob", "Mobility"], ["adj", "Adjust"]].map(([k, l]) => (
            <button key={k} className={"tb" + (tab === k ? " on" : "")} onClick={() => setTab(k)} aria-label={l} aria-current={tab === k}>
              <span className="tb-i"><Icon n={k} />{k === "adj" && cards.length > 0 && <i className="dot" />}</span>
              <span className="tb-l">{l}</span>
            </button>
          ))}
        </div>
      </nav>

      {editing && <Sheet day={days.find((x) => x.d === editing)} existing={logs[editing]} onSave={saveLog} onDelete={delLog} onClose={() => setEditing(null)} />}
    </div>
  );
}

/* ═══════════════ VIEWS ═══════════════ */
function WeekStrip({ days, today, logs, onEdit }) {
  const cw = (days.find((x) => x.d >= today) || days[days.length - 1]).w;
  const wd = days.filter((x) => x.w === cw);
  return (
    <div className="strip-wrap">
      {wd.map((x) => {
        const l = logs[x.d];
        const isT = x.d === today;
        const past = x.d < today;
        return (
          <button key={x.d} className={"sday" + (isT ? " t" : "")} onClick={() => onEdit(x.d)}>
            <span className="sd-l">{fLtr(x.d)}</span>
            <span className="sd-dot" style={{
              background: l && l.status !== "missed" ? TIER[x.ty] : "transparent",
              borderColor: l && l.status === "missed" ? "#E4544B" : TIER[x.ty],
              opacity: past && !l ? 0.35 : 1,
            }} />
          </button>
        );
      })}
    </div>
  );
}

function Today({ day, today, days, logs, onEdit, cards, go }) {
  if (!day) return <div className="card"><h3>Block complete</h3><p className="p">Log the race, then take a down week.</p></div>;
  const l = logs[day.d];
  const alert = cards.find((c) => c.sev === "alert");
  const c = TIER[day.ty];
  return (
    <React.Fragment>
      <WeekStrip days={days} today={today} logs={logs} onEdit={onEdit} />
      {alert && <button className="strip" onClick={() => go("adj")}>{alert.title} — see the adjustment</button>}
      {day.d !== today && <div className="lead">Next session</div>}
      <section className="sess" style={{ borderLeft: `4px solid ${c}` }}>
        <div className="sess-h">
          <span>{fShort(day.d)}</span>
          <span className="tag" style={{ color: c, borderColor: c + "55", background: c + "1C" }}>{LABEL[day.ty]}</span>
        </div>
        <h2>{day.t}</h2>
        <p className="sess-d">{day.s}</p>
        {day.moved && <p className="moved">Moved {day.moved}</p>}
        <div className="meta">
          {day.mi > 0 && <div><span>Distance</span><b>{day.mi} mi</b></div>}
          {day.lift && <div><span>Strength</span><b>Session {day.lift}</b></div>}
          {day.core && <div><span>Core</span><b>10–12 min</b></div>}
        </div>
        {day.ln && <p className="ln">{day.ln}</p>}
        <div className="links">
          {(day.lift || day.core) && <button className="link" onClick={() => go("lift")}>{day.lift ? `Session ${day.lift}` : "Core"} →</button>}
          {day.mi > 0 && <button className="link" onClick={() => go("mob")}>Post-run →</button>}
        </div>
        {l ? (
          <div className="done">
            <div className="done-r">
              <span className={"pill " + l.status}>{l.status === "done" ? "As planned" : l.status === "modified" ? "Modified" : "Missed"}</span>
              {l.miles > 0 && <span className="mono">{l.miles} mi</span>}
              {l.avgPace && <span className="mono">{l.avgPace}/mi</span>}
              {l.rpe > 0 && <span className="mono">RPE {l.rpe}</span>}
              {l.lift && <span className="mono">lift ✓</span>}
              {l.core && <span className="mono">core ✓</span>}
              {l.mob && <span className="mono">mob ✓</span>}
            </div>
            {l.notes && <p className="note">{l.notes}</p>}
            <button className="btn ghost" onClick={() => onEdit(day.d)}>Edit</button>
          </div>
        ) : <button className="btn solid" onClick={() => onEdit(day.d)}>Log this session</button>}
      </section>
    </React.Fragment>
  );
}

function Plan({ days, logs, today, stats, onEdit }) {
  const [open, setOpen] = useState(() => (days.find((x) => x.d >= today) || days[0]).w);
  const ws = [...new Set(days.map((x) => x.w))];
  const legend = [["easy", "Easy"], ["long", "Long"], ["threshold", "Threshold"], ["vo2", "Hard"], ["race", "Race"]];
  return (
    <React.Fragment>
      <div className="kpi">
        <div><b>{stats.actual.toFixed(1)}<em>/{stats.planned.toFixed(1)}</em></b><span>miles</span></div>
        <div><b>{stats.qD}<em>/{stats.qT}</em></b><span>hard sessions</span></div>
      </div>
      <div className="leg">{legend.map(([k, n]) => <span key={k}><i style={{ background: TIER[k] }} />{n}</span>)}</div>
      {ws.map((w) => {
        const wd = days.filter((x) => x.w === w);
        const pl = wd.reduce((a, x) => a + x.mi, 0);
        const ac = wd.reduce((a, x) => a + (logs[x.d] ? (logs[x.d].miles || 0) : 0), 0);
        const isOpen = open === w;
        return (
          <section key={w} className="wk">
            <button className="wk-h" onClick={() => setOpen(isOpen ? null : w)}>
              <span className="wk-n">{w}</span>
              <span className="wk-i"><b>{WEEKS[w]}</b></span>
              <span className="wk-m mono">{ac > 0 ? `${ac.toFixed(1)}/${pl.toFixed(1)}` : pl.toFixed(1)}</span>
              <span className={"chev" + (isOpen ? " up" : "")}>›</span>
            </button>
            {isOpen && (
              <div className="dlist">
                {wd.map((x) => {
                  const l = logs[x.d];
                  const c = TIER[x.ty];
                  return (
                    <div key={x.d} className={"row" + (x.d === today ? " now" : "")}>
                      <button onClick={() => onEdit(x.d)}>
                        <i className="bar" style={{ background: c }} />
                        <span className="row-d"><em>{fDow(x.d)}</em><b className="mono">{fNum(x.d)}</b></span>
                        <span className="row-b">
                          <b style={{ color: c }}>{x.t}</b><small>{x.s}</small>
                          <span className="chips">
                            {x.lift && <i className="chip">Lift {x.lift}</i>}
                            {x.core && <i className="chip">Core</i>}
                          </span>
                          {l && <span className={"row-l " + l.status}>{l.status === "missed" ? "Missed" : `${l.miles || 0} mi${l.avgPace ? ` · ${l.avgPace}` : ""}${l.rpe ? ` · RPE ${l.rpe}` : ""}`}</span>}
                        </span>
                        <span className="row-m mono">{x.mi || ""}</span>
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        );
      })}
    </React.Fragment>
  );
}

function Adjust({ cards, applied, onApply, handoff, copy, onExport, onImport, onReset }) {

    <React.Fragment>
      {cards.length === 0
        ? <div className="card"><h3>Plan stands</h3><p className="p">Changes appear here when you log a missed day, a swap, a session that ran too hard, or pain.</p></div>

          <article key={c.id} className={"adj " + c.sev}>

        <section className="card"><h3>Applied</h3>

      <section className="card">

function Sheet({ day, existing, onSave, onDelete, onClose }) {
  const [status, setStatus] = useState(existing ? existing.status : "done");
  const [miles, setMiles] = useState(existing ? existing.miles : (day.mi || ""));
  const [avgPace, setAvgPace] = useState(existing ? existing.avgPace || "" : "");
  const [splits, setSplits] = useState(existing ? existing.splits || "" : "");
  const [rpe, setRpe] = useState(existing ? existing.rpe || 0 : 0);
  const [lift, setLift] = useState(existing ? !!existing.lift : false);
  const [core, setCore] = useState(existing ? !!existing.core : false);
  const [mob, setMob] = useState(existing ? !!existing.mob : false);
  const [pain, setPain] = useState(existing ? !!existing.pain : false);
  const [swap, setSwap] = useState(existing ? existing.swap || "" : "");
  const [notes, setNotes] = useState(existing ? existing.notes || "" : "");
  const off = status === "missed";
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startY = useRef(null);

  const onDragStart = (e) => { startY.current = e.touches[0].clientY; setDragging(true); };
  const onDragMove = (e) => {
    if (startY.current == null) return;
    const dy = e.touches[0].clientY - startY.current;
    setDragY(dy > 0 ? dy : 0);
  };
  const onDragEnd = () => {
    setDragging(false);
    if (dragY > 90) onClose(); else setDragY(0);
    startY.current = null;
  };

  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);

  const submit = () => onSave(day.d, {
    status, miles: off ? 0 : Number(miles) || 0, avgPace: off ? "" : avgPace.trim(),
    splits: off ? "" : splits.trim(), rpe: off ? 0 : Number(rpe) || 0,
    lift: off ? false : lift, core: off ? false : core, mob: off ? false : mob,
    pain, swap: status === "modified" ? swap.trim() : "", notes: notes.trim(),
  });

  return (
    <div className="wrap" role="dialog" aria-modal="true" aria-label={`Log ${day.t}`}>
      <div className="scrim" onClick={onClose} />
      <div className={"sheet" + (dragging ? " dragging" : "")} style={dragY ? { transform: `translateY(${dragY}px)` } : undefined}>
        <div className="drag" onTouchStart={onDragStart} onTouchMove={onDragMove} onTouchEnd={onDragEnd}>
          <div className="grip" />
          <div className="sh-h">
            <div><small>{fShort(day.d)}</small><h3>{day.t}</h3></div>
            <button className="x" onClick={onClose} aria-label="Close">✕</button>
          </div>
        </div>
        <div className="sh-b">
          <div className="f">
            <label>How did it go?</label>
            <div className="seg">
              {[["done", "As planned"], ["modified", "Something else"], ["missed", "Missed"]].map(([k, l]) => (
                <button key={k} className={"sg" + (status === k ? " on" : "")} onClick={() => setStatus(k)}>{l}</button>
              ))}
            </div>
          </div>
          {status === "modified" && (
            <div className="f"><label>What instead?</label>
              <input className="in" value={swap} onChange={(e) => setSwap(e.target.value)} placeholder="4×1000 instead of 6×800" /></div>
          )}
          {!off && (
            <React.Fragment>
              <div className="fr">
                <div className="f"><label>Miles</label><input className="in mono" inputMode="decimal" value={miles} onChange={(e) => setMiles(e.target.value)} placeholder="0" /></div>
                <div className="f"><label>Avg pace</label><input className="in mono" inputMode="numeric" value={avgPace} onChange={(e) => setAvgPace(fmtPace(e.target.value))} placeholder="6:12" /></div>
              </div>
              {QUALITY.has(day.ty) && (
                <div className="f"><label>Splits</label><input className="in mono" value={splits} onChange={(e) => setSplits(fmtSplits(e.target.value))} placeholder="2:56 / 2:54 / 2:57" /></div>
              )}
              <div className="f">
                <label>Effort <b className="rpe">{rpe || "—"}</b></label>
                <input type="range" min="0" max="10" value={rpe} onChange={(e) => setRpe(e.target.value)} className="sl" />
                <div className="sc"><span>easy</span><span>comfortably hard</span><span>all out</span></div>
              </div>
              <div className="f">
                <label>Also done</label>
                <div className="ck">
                  {day.lift && <button className={"cb" + (lift ? " on" : "")} onClick={() => setLift(!lift)}>Session {day.lift}</button>}
                  {day.core && <button className={"cb" + (core ? " on" : "")} onClick={() => setCore(!core)}>Core</button>}
                  <button className={"cb" + (mob ? " on" : "")} onClick={() => setMob(!mob)}>Mobility</button>
                </div>
              </div>
            </React.Fragment>
          )}
          <div className="f">
            <button className={"cb w" + (pain ? " on red" : "")} onClick={() => setPain(!pain)}>
              {pain ? "Flagged: something hurts" : "Flag pain or a niggle"}
            </button>
          </div>
          <div className="f"><label>Notes</label>
            <textarea className="in ta" rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Legs, weather, sleep" /></div>
        </div>
        <div className="sh-f">
          {existing && <button className="btn ghost sm" onClick={() => onDelete(day.d)}>Delete</button>}
          <button className="btn solid" onClick={submit}>Save</button>
        </div>
      </div>
    </div>
  );
}

function summary(days, logs, applied, today, stats) {
  const L = [`SUB-18 UPDATE · ${fShort(today)} · ${diff(RACE, today)} days out`,
  `Volume ${stats.actual.toFixed(1)}/${stats.planned.toFixed(1)} mi · hard sessions ${stats.qD}/${stats.qT}`];
  const recent = days.filter((x) => x.d <= today && diff(today, x.d) <= 14 && logs[x.d]);
  if (recent.length) {
    L.push("", "LAST 14 DAYS");
    recent.forEach((x) => {
      const l = logs[x.d];
      let s = `${fShort(x.d)} · ${x.t} — `;
      if (l.status === "missed") s += "MISSED";
      else {
        const b = [];
        if (l.status === "modified" && l.swap) b.push(`did: ${l.swap}`);
        if (l.miles) b.push(`${l.miles} mi`);
        if (l.avgPace) b.push(`${l.avgPace}/mi`);
        if (l.splits) b.push(l.splits);
        if (l.rpe) b.push(`RPE ${l.rpe}`);
        if (l.lift) b.push("lift ✓");
        if (l.core) b.push("core ✓");
        if (l.mob) b.push("mob ✓");
        s += b.join(" · ") || "logged";
      }
      if (l.pain) s += " ⚑ PAIN";
      if (l.notes) s += ` — "${l.notes}"`;
      L.push(s);
    });
  }
  const un = days.filter((x) => x.d < today && x.ty !== "rest" && !logs[x.d]).length;
  if (un) L.push("", `Unlogged run days: ${un}`);
  if (applied.length) { L.push("", "CHANGES APPLIED"); applied.forEach((a) => L.push(`${fShort(a.on)} · ${a.label}`)); }
  L.push("", "NEXT UP");
  days.filter((x) => x.d >= today).slice(0, 4).forEach((x) => L.push(`${fShort(x.d)} · ${x.t} — ${x.s}`));
  L.push("", "Question:");
  return L.join("\n");
}
